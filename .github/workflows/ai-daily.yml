name: Generate daily AI post

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Tema'
        required: false
        default: 'vita'
  schedule:
    - cron: '30 17 * * *'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate with DeepSeek
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TOPIC: ${{ inputs.topic || 'vita' }}
        run: python scripts/generate_post.py
      - name: Commit generated post
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.json data/history.json
          git diff --cached --quiet || git commit -m 'Generate AI post'
          git push
